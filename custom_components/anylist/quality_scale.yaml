rules:
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: Entities use DataUpdateCoordinator listeners and do not subscribe to external event callbacks.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: AnyList is a cloud account service and does not expose discoverable local devices.
  discovery-update-info:
    status: exempt
    comment: There is no discovery source for this cloud account integration.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class:
    status: exempt
    comment: Todo entities, list setting selects and the diagnostic URL sensor do not have applicable device classes.
  entity-disabled-by-default:
    status: exempt
    comment: The integration exposes selected shopping lists, their two list settings and one optional diagnostic sensor only.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: Authentication failures use ConfigEntryAuthFailed and the reauthentication flow; no additional repair flow is currently needed.
  stale-devices: done

  async-dependency:
    status: exempt
    comment: The integration uses a bundled pure-Python client for an unofficial API and runs blocking calls in the executor with timeouts.
  inject-websession:
    status: exempt
    comment: The bundled client uses urllib for multipart protobuf requests and has no aiohttp web session to inject.
  strict-typing:
    status: todo
    comment: Type annotations are present, but strict project-wide pyright/mypy coverage is not yet enforced.
