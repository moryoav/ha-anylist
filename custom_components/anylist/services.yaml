add_item:
  name: Add item
  description: Add an item or reuse a matching checked item. A supplied category overrides its previous category. Omitted quantity, notes, and category assignments are preserved on reused items.
  target:
    entity:
      integration: anylist
      domain: todo
  fields:
    name:
      name: Name
      description: Item name without quantity or notes. A checked item with the same name is reused, ignoring case.
      required: true
      example: Bread
      selector:
        text:
    quantity:
      name: Quantity
      description: Quantity text, such as 2 or 2 kg. Omit to preserve a reused item's quantity. Use an empty string to clear it.
      example: "2"
      selector:
        text:
    notes:
      name: Notes
      description: Item notes. Omit to preserve a reused item's notes. Use an empty string to clear them.
      example: Bakery
      selector:
        text:
          multiline: true
    category:
      name: Category
      description: Existing category name or match ID. Overrides known categorization, including on reused checked items. Invalid or ambiguous selections reject the action. Provide either this or category_id.
      example: Dairy
      selector:
        text:
    category_id:
      name: Category ID
      description: Exact category ID from get_categories, as an alternative to a category name.
      advanced: true
      selector:
        text:
    category_set_id:
      name: Category set ID
      description: Optional exact set ID from get_categories. Use it to distinguish matching names in different sets.
      advanced: true
      selector:
        text:

update_item:
  name: Update item
  description: Change quantity, notes, or a category assignment without changing the item's name or checked state. Omitted fields and assignments in other category sets are preserved. Supply at least one field.
  target:
    entity:
      integration: anylist
      domain: todo
  fields:
    item:
      name: Item
      description: Item UID from todo.get_items, or an exact, case-sensitive item name. Use a UID if names are duplicated.
      required: true
      example: Bread
      selector:
        text:
    quantity:
      name: Quantity
      description: New quantity text. Omit to keep the current value. Use an empty string to clear it.
      example: "3"
      selector:
        text:
    notes:
      name: Notes
      description: New notes. Omit to keep the current value. Use an empty string to clear them.
      example: For Wednesday's dinner
      selector:
        text:
          multiline: true
    category:
      name: Category
      description: Category name or match ID for an explicit move. Unknown or ambiguous categories reject the entire action. Provide either this or category_id.
      example: Dairy
      selector:
        text:
    category_id:
      name: Category ID
      description: Exact category ID from get_categories, as an alternative to a category name.
      advanced: true
      selector:
        text:
    category_set_id:
      name: Category set ID
      description: Optional exact set ID from get_categories. Use it to distinguish matching names in different sets.
      advanced: true
      selector:
        text:

create_category:
  name: Create category
  description: Create a custom category and optionally return its ID and metadata. Reject duplicate names within the selected set. Does not create items or change the default category.
  target:
    entity:
      integration: anylist
      domain: todo
  fields:
    name:
      name: Name
      description: Non-empty name for the new category. Names ignore case and extra whitespace when checking for duplicates within the set.
      required: true
      example: Household supplies
      selector:
        text:
    category_set_id:
      name: Category set ID
      description: Exact set ID from get_categories. Required when the list has multiple sets; otherwise the only set is used.
      advanced: true
      selector:
        text:

get_categories:
  name: Get categories
  description: Return category names, IDs, and category sets for each targeted AnyList to-do entity, including empty categories. Refresh before reading and optionally include item counts per category.
  target:
    entity:
      integration: anylist
      domain: todo
  fields:
    category_set_id:
      name: Category set ID
      description: Optional exact set ID to return only that set's categories.
      advanced: true
      selector:
        text:
    include_counts:
      name: Include item counts
      description: Include needs_action_count, completed_count, and total_count for each category. Counts are independent for each set.
      default: false
      selector:
        boolean:

refresh:
  name: Refresh
  description: Refresh lists and favourites for a loaded AnyList account.
  fields:
    config_entry_id:
      name: Config entry ID
      description: Specific AnyList config entry to refresh when multiple AnyList accounts are configured.
      advanced: true
      example: "01HABCDEF1234567890"
      selector:
        text:

search_recipes:
  name: Search recipes
  description: >-
    Find compact recipe candidates by words in any order, with minor typo tolerance.
    Returns recipes (id, name, score, match_explanation, collections), count and has_more.
    Scores rank relevance, not confidence. Use conversation context to select a
    candidate, clarify ambiguous matches before editing, then call get_recipe with
    its exact ID for full details.
  fields:
    config_entry_id:
      name: Config entry ID
      description: Specific AnyList config entry to query when multiple AnyList accounts are configured. Use the same entry for get_recipe.
      advanced: true
      example: "01HABCDEF1234567890"
      selector:
        text:
    query:
      name: Query
      description: Recipe search words. Must contain at least one letter or number. Case, punctuation, accents and word order are normalized; extra title words are allowed.
      required: true
      example: "pink horseradish salmon"
      selector:
        text:
    limit:
      name: Limit
      description: Maximum candidates to return (1 to 50). Defaults to 15. Unrelated recipes are excluded even if fewer candidates remain.
      default: 15
      selector:
        number:
          min: 1
          max: 50
          step: 1
          mode: box
    include_ingredients:
      name: Search ingredient names
      description: Also match ingredient names, with less weight than titles. Ingredients and preparation steps are never included in search results.
      default: false
      selector:
        boolean:
    collection_id:
      name: Collection ID
      description: Exact collection ID from get_collections. Provide either collection_id or collection_name.
      example: collection_123
      selector:
        text:
    collection_name:
      name: Collection name
      description: Collection name, ignoring case and extra whitespace. Must match one collection. Provide either collection_name or collection_id.
      example: Cocktails
      selector:
        text:

get_recipes:
  name: Get recipes
  description: Return AnyList recipes with collection memberships and optional name substring and collection filters. For ranked word and typo matching, use search_recipes, then get_recipe with a selected ID.
  fields:
    config_entry_id:
      name: Config entry ID
      description: Specific AnyList config entry to query when multiple AnyList accounts are configured.
      advanced: true
      example: "01HABCDEF1234567890"
      selector:
        text:
    query:
      name: Query
      description: Case-insensitive substring filter applied to recipe names.
      example: "pasta"
      selector:
        text:
    include_ingredients:
      name: Include ingredients
      description: Include ingredients in each returned recipe.
      default: true
      selector:
        boolean:
    include_steps:
      name: Include preparation steps
      description: Include preparation steps in each returned recipe.
      default: false
      selector:
        boolean:
    collection_id:
      name: Collection ID
      description: Exact collection ID from get_collections. Provide either collection_id or collection_name.
      example: collection_123
      selector:
        text:
    collection_name:
      name: Collection name
      description: Collection name, ignoring case and extra whitespace. Must match one collection. Provide either collection_name or collection_id.
      example: Cocktails
      selector:
        text:

get_recipe:
  name: Get recipe
  description: Return a single AnyList recipe with its collection memberships by ID or exact name. After search_recipes, pass the selected candidate's exact ID as recipe_id to retrieve full details. Clarify ambiguous matches before editing.
  fields:
    config_entry_id:
      name: Config entry ID
      description: Specific AnyList config entry to query when multiple AnyList accounts are configured.
      advanced: true
      example: "01HABCDEF1234567890"
      selector:
        text:
    recipe_id:
      name: Recipe ID
      description: Unique AnyList recipe ID. Provide either this or name.
      example: "recipe_123"
      selector:
        text:
    name:
      name: Name
      description: Exact AnyList recipe name. Provide either this or recipe_id.
      example: "Weeknight Pasta"
      selector:
        text:
    include_ingredients:
      name: Include ingredients
      description: Include ingredients in the returned recipe.
      default: true
      selector:
        boolean:
    include_steps:
      name: Include preparation steps
      description: Include preparation steps in the returned recipe.
      default: true
      selector:
        boolean:

add_recipe_to_list:
  name: Add recipe to list
  description: Add an AnyList recipe's ingredients to a shopping list.
  fields:
    config_entry_id:
      name: Config entry ID
      description: Specific AnyList config entry to use when multiple AnyList accounts are configured.
      advanced: true
      example: "01HABCDEF1234567890"
      selector:
        text:
    recipe_id:
      name: Recipe ID
      description: Unique AnyList recipe ID. Provide either this or recipe_name.
      example: "recipe_123"
      selector:
        text:
    recipe_name:
      name: Recipe name
      description: Exact AnyList recipe name. Provide either this or recipe_id.
      example: "Weeknight Pasta"
      selector:
        text:
    list_id:
      name: List ID
      description: AnyList shopping list ID. Provide either this or list_name.
      example: "list_123"
      selector:
        text:
    list_name:
      name: List name
      description: Exact AnyList shopping list name. Provide either this or list_id.
      example: "Groceries"
      selector:
        text:
    scale_factor:
      name: Scale factor
      description: Optional multiplier to scale ingredient quantities when adding the recipe to the shopping list.
      example: 2
      selector:
        number:
          min: 0
          step: 0.1
          mode: box

create_recipe:
  name: Create recipe
  description: Create a new AnyList recipe.
  fields:
    image_url:
      name: Image URL
      description: Public HTTP or HTTPS URL of an image for the recipe. AnyList downloads and stores the image before creating the recipe.
      example: "https://example.com/recipe.jpg"
      selector:
        text:
          type: url
    config_entry_id:
      name: Config entry ID
      description: Specific AnyList config entry to use when multiple AnyList accounts are configured.
      advanced: true
      example: "01HABCDEF1234567890"
      selector:
        text:
    name:
      name: Name
      description: Name of the recipe to create.
      required: true
      example: "No-Knead Pizza Dough"
      selector:
        text:
    ingredients:
      name: Ingredients
      description: List of ingredient objects with a required name and optional quantity, note, and raw_ingredient fields.
      required: true
      example:
        - name: Flour
          quantity: 500 g
        - name: Water
          quantity: 350 ml
        - name: Salt
          quantity: 10 g
    preparation_steps:
      name: Preparation steps
      description: Ordered list of preparation step strings.
      required: true
      example:
        - Mix the ingredients.
        - Rest the dough overnight.
        - Bake at 250 C.

update_recipe:
  name: Update recipe
  description: Update an existing AnyList recipe by ID or exact current recipe name. Preserve its image unless image_url is supplied.
  fields:
    image_url:
      name: Image URL
      description: Public HTTP or HTTPS URL of an image to add or replace. Omit to keep the existing image. AnyList downloads and stores the image before updating the recipe.
      example: "https://example.com/recipe.jpg"
      selector:
        text:
          type: url
    config_entry_id:
      name: Config entry ID
      description: Specific AnyList config entry to use when multiple AnyList accounts are configured.
      advanced: true
      example: "01HABCDEF1234567890"
      selector:
        text:
    recipe_id:
      name: Recipe ID
      description: Unique AnyList recipe ID. Provide either this or recipe_name.
      example: "recipe_123"
      selector:
        text:
    recipe_name:
      name: Current recipe name
      description: Exact current AnyList recipe name. Provide either this or recipe_id.
      example: "No-Knead Pizza Dough"
      selector:
        text:
    name:
      name: New name
      description: Replacement recipe name.
      required: true
      example: "Same-Day Pizza Dough"
      selector:
        text:
    ingredients:
      name: Ingredients
      description: Complete replacement ingredient list.
      required: true
      example:
        - name: Flour
          quantity: 500 g
        - name: Water
          quantity: 325 ml
    preparation_steps:
      name: Preparation steps
      description: Complete replacement preparation steps.
      required: true
      example:
        - Mix all ingredients.
        - Knead until smooth.
        - Rest for 2 hours.

delete_recipe:
  name: Delete recipe
  description: Delete an AnyList recipe by ID or exact name.
  fields:
    config_entry_id:
      name: Config entry ID
      description: Specific AnyList config entry to use when multiple AnyList accounts are configured.
      advanced: true
      example: "01HABCDEF1234567890"
      selector:
        text:
    recipe_id:
      name: Recipe ID
      description: Unique AnyList recipe ID. Provide either this or name.
      example: "recipe_123"
      selector:
        text:
    name:
      name: Name
      description: Exact AnyList recipe name. Provide either this or recipe_id.
      example: "No-Knead Pizza Dough"
      selector:
        text:

get_collections:
  name: Get recipe collections
  description: Return all user recipe collections, including empty ones, with id, name and recipe_ids. The system All Recipes view is excluded.
  fields:
    config_entry_id:
      name: Config entry ID
      description: Specific AnyList config entry to use when multiple AnyList accounts are configured.
      advanced: true
      example: 01HABCDEF1234567890
      selector:
        text:

add_recipe_to_collection:
  name: Add recipe to collection
  description: Add an existing recipe to a collection and confirm the saved membership. Other memberships and recipe content are preserved. An already satisfied membership makes no change.
  fields:
    config_entry_id:
      name: Config entry ID
      description: Specific AnyList config entry to use when multiple AnyList accounts are configured.
